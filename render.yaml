services:
  - type: web
    name: jds-economiza-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: JDS_WEB
        value: "0"
      - key: AMAZON_ACCESS_KEY
        sync: false
      - key: AMAZON_SECRET_KEY
        sync: false
      - key: AMAZON_PARTNER_TAG
        value: jdseconomiz0e-20
      - key: SHOPEE_APP_ID
        sync: false
      - key: SHOPEE_SECRET
        sync: false
